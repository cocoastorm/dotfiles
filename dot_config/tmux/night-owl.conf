# ─────────────────────────────────────────────────────────────
# Night Owl theme for tmux  (self-contained, no external plugin)
# Vendored from catppuccin/tmux layout, recolored to Night Owl.
# Palette (Sarah Drasner VS Code Night Owl). Edit here only.
# ─────────────────────────────────────────────────────────────

# ── Night Owl palette (our own @thm_* constants) ──
set -gq @thm_bg "#011627"
set -gq @thm_fg "#d6deeb"
set -gq @thm_mantle "#0b2942"
set -gq @thm_crust "#010d18"
set -gq @thm_surface_0 "#0b2942"
set -gq @thm_surface_1 "#102a44"
set -gq @thm_surface_2 "#1d3b53"
set -gq @thm_overlay_0 "#234d70"
set -gq @thm_overlay_1 "#5f7e97"
set -gq @thm_overlay_2 "#7e97ac"
set -gq @thm_subtext_0 "#8b9dc3"
set -gq @thm_subtext_1 "#a7b3cc"
set -gq @thm_mauve "#c792ea"
set -gq @thm_blue "#82aaff"
set -gq @thm_red "#ef5350"
set -gq @thm_green "#22da6e"
set -gq @thm_yellow "#ffcb6b"
set -gq @thm_teal "#21c7a8"
set -gq @thm_maroon "#7e57c2"
set -gq @thm_peach "#f78c6c"
set -gq @thm_flamingo "#ff869a"
set -gq @thm_rosewater "#d7dbe0"
set -gq @thm_pink "#ff2c83"
set -gq @thm_sky "#82aaff"
set -gq @thm_sapphire "#7fdbca"
set -gq @thm_lavender "#c792ea"

# ── Status bar ──
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-style "bg=#0b2942,fg=#d6deeb"
set -g status-right "#[fg=#7e57c2]#[fg=#010d18,bg=#7e57c2] #[fg=#d6deeb,bg=#0b2942] #{pane_current_command}#[fg=#0b2942] #[fg=#{?client_prefix,#{@thm_red},{@thm_green}}]#[fg=#010d18,bg=#{?client_prefix,#{@thm_red},{@thm_green}}] #[fg=#d6deeb,bg=#0b2942] #S#[fg=#0b2942] "

# ── Windows ──
set -g window-status-format "#[fg=#010d18,bg=#{@thm_overlay_2}]#[fg=#0b2942,reverse]#[none]#I #[fg=#d6deeb,bg=#{@thm_surface_0}] #T#{?window_activity_flag, 󱅫,}#{?window_bell_flag, 󰂞,}#{?window_silence_flag, 󰂛,}#{?window_active, 󰖯,}#{?window_last_flag, 󰖰,}#{?window_marked_flag, 󰃀,}#{?window_zoomed_flag, 󰁌,} #[fg=#0b2942,reverse]#[none]"
set -g window-status-current-format "#[fg=#010d18,bg=#{@thm_mauve}]#[fg=#0b2942,reverse]#[none]#I #[fg=#d6deeb,bg=#{@thm_surface_1}] #T#{?window_activity_flag, 󱅫,}#{?window_bell_flag, 󰂞,}#{?window_silence_flag, 󰂛,}#{?window_active, 󰖯,}#{?window_last_flag, 󰖰,}#{?window_marked_flag, 󰃀,}#{?window_zoomed_flag, 󰁌,} #[fg=#0b2942,reverse]#[none]"
set -g window-status-activity-style "bg=#c792ea,fg=#010d18"
set -g window-status-bell-style "bg=#ffcb6b,fg=#010d18"

# ── Messages / panes / mode / clock / popups / menu ──
set -g message-style "fg=#21c7a8,bg=default,align=centre"
set -g message-command-style "fg=#21c7a8,bg=default,align=centre"
set -wg pane-border-style "fg=#234d70"
set -wg pane-active-border-style "#{?pane_in_mode,fg=#c792ea,#{?pane_synchronized,fg=#c792ea,fg=#c792ea}}"
set -g mode-style "bg=#0b2942,bold"
set -g clock-mode-colour "#82aaff"
set -g popup-style "bg=#011627,fg=#d6deeb"
set -g popup-border-style "fg=#102a44"
set -g menu-selected-style "fg=#d6deeb,bold,bg=#234d70"
