# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"

# Support mouse
set -g mouse on

# Enable OSC 8 hyperlink passthrough to the terminal
set -as terminal-features ',*:hyperlinks'
set -g allow-passthrough on

# Click OSC 8 hyperlinks to open in browser; fallback to normal tmux mouse behavior
bind-key -T root MouseUp1Pane \
    select-pane -t= \; \
    if-shell -F '#{mouse_hyperlink}' \
        'run-shell -b "xdg-open #{q:mouse_hyperlink}"' \
        'send-keys -M'

# Support extended lines
set -g extended-keys on
set -g extended-keys-format csi-u

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# ── Theme (self-contained Night Owl, no external plugin) ──
source-file ~/.config/tmux/night-owl.conf

# ── TPM plugins ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open windows and panes in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'
